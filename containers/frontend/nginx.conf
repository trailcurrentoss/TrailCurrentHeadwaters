events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 1g;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name _;  # Match any hostname; TLS cert is self-signed

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        root /usr/share/nginx/html;
        index index.html;

        # HTML entry point - never cache
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # PWA Service Worker - must revalidate
        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            expires off;
            access_log off;
        }

        # Manifest - must revalidate, correct MIME type for PWA installability
        location = /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            types { }
            default_type application/manifest+json;
        }

        # Apple touch icon - must revalidate (no content hash in filename)
        location = /apple-touch-icon.png {
            add_header Cache-Control "no-cache";
        }

        # Static files caching (exclude /tiles/ and /api/ paths)
        # These should have content hashes in the filename
        location ~* ^(?!/tiles/)(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Deployment upload — streaming proxy (no buffering) with extended timeouts
        location /api/deployments/upload {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_request_buffering off;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # NOTE: tileserver/data/fonts/styles endpoints removed as part of
        # the maps migration -- see PLANS/Offline-Maps-Migration.md. These
        # will be replaced by static PMTiles served from the same bundle
        # upload pipeline. In the interim, requests to these paths return
        # 503 so the SPA can render an "unavailable" state cleanly rather
        # than nginx failing to start against an unresolvable upstream.
        location /tiles/  { return 503; }
        location /data/   { return 503; }
        location /fonts/  { return 503; }
        location /styles/ { return 503; }


        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            # Ensure HTML responses are never cached
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}