# Listener for secure MQTT over TLS (port 8883)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Require username/password authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Optional: logging
# NOTE: log_type must NOT include 'debug' or 'all' in production.
# Debug-level logging on this broker prints one line per subscriber per
# PUBLISH, which under CAN/GPS/relay traffic (thousands of msgs/sec)
# saturates dockerd's json-file writer, causes healthcheck timeouts,
# stalls MQTT keepalives, and locks up the box.
log_dest stdout
log_type error
log_type warning
log_type notice
