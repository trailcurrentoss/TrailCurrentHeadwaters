name: trailcurrent

services:
  frontend:
    image: trailcurrent-in-vehicle-frontend:latest
    build:
      context: ./containers/frontend
      dockerfile: Dockerfile
    volumes:
      - ./data/keys/server.crt:/etc/nginx/certs/server.crt:ro
      - ./data/keys/server.key:/etc/nginx/certs/server.key:ro
    ports:
      - "443:443"
    restart: unless-stopped # Import for reboots
    depends_on:
      - backend
  backend:
    image: trailcurrent-in-vehicle-backend:latest
    build:
      context: ./containers/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=mongodb://mongodb:27017/trailcurrent
      - API_PORT=3000
      - MQTT_BROKER_URL=mqtts://mosquitto:8883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TLS_CERT_HOSTNAME=${TLS_CERT_HOSTNAME}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./data/keys/ca.pem:/app/certs/ca.pem:ro
      - ./data/firmware:/app/firmware
      - ./data/deployments:/app/deployments
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      # Host root FS bind-mount so system-stats can statvfs the actual host
      # disk (procfs/sysfs don't report block-device totals). Read-only,
      # matches the /host/proc + /host/sys naming pattern.
      - /:/host/root:ro
      # Share host's avahi-daemon so the backend can resolve *.local
      # hostnames (Peregrine, other LAN devices) — Docker bridge nets
      # don't propagate mDNS multicast.
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    restart: unless-stopped # Import for reboots
    depends_on:
      - mosquitto
      - mongodb
      - tileserver
      - geocoder
      - nominatim
  geocoder:
    # Offline reverse-geocode service (GeoNames cities1000).
    # Backend proxies /api/geocode/reverse to this container so the browser
    # never talks to it directly. Fully offline once built.
    image: trailcurrent-in-vehicle-geocoder:latest
    build:
      context: ./containers/geocoder
      dockerfile: Dockerfile
    restart: unless-stopped
  nominatim:
    # Offline forward-geocode / search service (Nominatim + PostgreSQL).
    # Backend proxies /api/geocode/search to this container on the Docker
    # bridge; the browser never talks to it directly.
    #
    # FIRST-RUN: this imports data/nominatim/map.osm.pbf into PostgreSQL,
    # which for a large regional PBF can take many hours and tens of GB of
    # disk. Progress shows in `docker compose logs -f nominatim`. Data
    # persists in the nominatim-data volume across restarts.
    #
    # See DOCS/UpdatingNominatim.md for how to obtain / regenerate the
    # map.osm.pbf file for a different region.
    image: mediagis/nominatim:4.5
    environment:
      - PBF_PATH=/nominatim/data/map.osm.pbf
      - NOMINATIM_PASSWORD=${NOMINATIM_PASSWORD:-trailcurrent}
      - IMPORT_WIKIPEDIA=false
      - IMPORT_US_POSTCODES=false
      - IMPORT_GB_POSTCODES=false
      - THREADS=4
    volumes:
      # NOT :ro — mediagis/nominatim's init.sh chowns /nominatim recursively
      # on first run, which fails on read-only mounts.
      - ./data/nominatim/map.osm.pbf:/nominatim/data/map.osm.pbf
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    restart: unless-stopped
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
  mosquitto:
    image: trailcurrent-in-vehicle-mosquitto:latest
    build:
      context: ./containers/mosquitto
      dockerfile: Dockerfile
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - ./data/keys/server.crt:/mosquitto/certs/server.crt:ro
      - ./data/keys/server.key:/mosquitto/certs/server.key:ro
      - ./data/keys/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "8883:8883"
    hostname: mosquitto
    restart: always
  tileserver:
    image: trailcurrent/trailcurrent-tile-server:latest
    build:
      context: ./containers/tileserver
      dockerfile: Dockerfile
    volumes:
      - ./data/tileserver/map.mbtiles:/data/tiles/map.mbtiles:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "node /usr/src/app/src/healthcheck.js"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb-data:
  mosquitto-data:
  mosquitto-log:
  nominatim-data:
