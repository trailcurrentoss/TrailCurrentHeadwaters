name: trailcurrent

services:
  frontend:
    image: trailcurrent-in-vehicle-frontend:latest
    build:
      context: ./containers/frontend
      dockerfile: Dockerfile
    volumes:
      - ./data/keys/server.crt:/etc/nginx/certs/server.crt:ro
      - ./data/keys/server.key:/etc/nginx/certs/server.key:ro
      # Read-only view of the map data volume so nginx can serve
      # tiles.pmtiles from the currently-applied bundle via /maps/. The
      # `current` symlink is relative (versions/<name>), so it resolves
      # correctly inside the container without following out of the mount.
      - ./data/maps:/data/maps:ro
    ports:
      - "443:443"
    restart: unless-stopped # Import for reboots
    depends_on:
      - backend
  backend:
    image: trailcurrent-in-vehicle-backend:latest
    build:
      context: ./containers/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=mongodb://mongodb:27017/trailcurrent
      - API_PORT=3000
      - MQTT_BROKER_URL=mqtts://mosquitto:8883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TLS_CERT_HOSTNAME=${TLS_CERT_HOSTNAME}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./data/keys/ca.pem:/app/certs/ca.pem:ro
      - ./data/firmware:/app/firmware
      - ./data/deployments:/app/deployments
      - ./data/maps:/app/maps
      - ./data/trails:/app/trails
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      # Host root FS bind-mount so system-stats can statvfs the actual host
      # disk (procfs/sysfs don't report block-device totals). Read-only,
      # matches the /host/proc + /host/sys naming pattern.
      - /:/host/root:ro
      # Share host's avahi-daemon so the backend can resolve *.local
      # hostnames (Peregrine, other LAN devices) — Docker bridge nets
      # don't propagate mDNS multicast.
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    restart: unless-stopped # Import for reboots
    depends_on:
      - mosquitto
      - mongodb
  # Photon geocoder — serves /api/geocode/search + /reverse.
  # Reads a pre-built index bind-mounted from the currently-applied map bundle
  # at data/maps/current/photon_data/. rtuszik/photon-docker is a community-
  # maintained image around github.com/komoot/photon (both Apache-2.0).
  # `profiles: [maps]` keeps this service out of the default `docker compose up`
  # bring-up so virgin devices (no data/maps/current symlink yet) don't hit a
  # bind-mount-source-missing error. map-watcher.py explicitly starts photon
  # via `docker compose up -d photon` after a bundle apply.
  photon:
    # Intentionally NOT digest-pinned. Every `build-and-save-images.sh` run
    # pulls whatever this tag resolves to at that moment; the resulting
    # image tarball is what ships. QA on the produced CM5 image is the gate
    # that catches upstream regressions BEFORE release — see
    # PLANS/Offline-Maps-Migration.md Phase 6 for the design tradeoff.
    image: rtuszik/photon-docker:2.3
    profiles: [maps]
    restart: unless-stopped
    environment:
      - INITIAL_DOWNLOAD=FALSE   # we ship the index in the map bundle
      - UPDATE_STRATEGY=DISABLED # map bundles are the update mechanism
      - PHOTON_LISTEN_IP=0.0.0.0
      - LOG_LEVEL=INFO
    volumes:
      # NOTE: writable (not :ro). Photon's embedded OpenSearch/Lucene needs
      # to write NodeLock, transaction logs, and _state/ files at startup,
      # even though our actual pre-built index inside `photon_data/` is
      # never modified. A :ro mount produced a Lucene lock failure in a
      # restart loop. See PLANS/Offline-Maps-Migration.md Phase 3 for the
      # Photon-lifecycle contract. Ownership of the underlying directory
      # is guaranteed by the deploy.sh bind-mount preflight.
      - ./data/maps/current:/photon/data
    # Not exposed on host — backend reaches it via the compose bridge only.

  # Valhalla routing engine — serves /api/route (and /api/route/matrix).
  # Reads pre-built routing tiles bind-mounted from the currently-applied
  # map bundle at data/maps/current/valhalla_tiles/. Image is the community-
  # maintained gis-ops/nilsnolde build (both Valhalla itself and this
  # packaging are MIT-licensed).
  #
  # `profiles: [maps]` keeps this out of the default compose bring-up so
  # virgin devices (no data/maps/current symlink) don't try to bind a
  # missing path. map-watcher.py's restart_data_consumers() brings it up
  # explicitly after a successful bundle apply.
  #
  # NOTE: the plan called out `ghcr.io/gis-ops/docker-valhalla/valhalla` —
  # that repo has been archived and moved. `ghcr.io/nilsnolde/docker-valhalla`
  # is the active successor; source tree and behaviour identical.
  valhalla:
    # Intentionally NOT digest-pinned. Same policy as photon — QA the
    # produced CM5 image catches upstream regressions. Note that the
    # upstream `:latest` tag is rebuilt every Saturday from Valhalla master,
    # so image builds days apart can pull materially different Valhallas —
    # image QA is where we discover if an env-var contract changed.
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    profiles: [maps]
    restart: unless-stopped
    environment:
      # Use the tiles we shipped in the bundle, don't try to rebuild from PBF.
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - serve_tiles=True
      # Skip auxiliary DB builds — the bundle's tiles were built with these
      # already merged in on the build machine (per build/maps/build.sh).
      - build_admins=False
      - build_time_zones=False
      # We deleted valhalla_tiles.tar during the map-watcher tar-extract step
      # to save disk. Directory-mode loading is fine for our data volume.
      - build_tar=False
      # Refresh missing config keys in an existing valhalla.json if a prior
      # container version wrote a stale one into the bundle dir.
      - update_existing_config=True
    volumes:
      # Writable so the entrypoint can create/update valhalla.json inside
      # the bundle dir. Ownership of the underlying directory is guaranteed
      # by the deploy.sh bind-mount preflight.
      - ./data/maps/current:/custom_files
    # Not exposed on host — backend reaches it via the compose bridge on
    # port 8002 only.

  mongodb:
    # Intentionally NOT digest-pinned; same policy as photon/valhalla.
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
  mosquitto:
    image: trailcurrent-in-vehicle-mosquitto:latest
    build:
      context: ./containers/mosquitto
      dockerfile: Dockerfile
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - ./data/keys/server.crt:/mosquitto/certs/server.crt:ro
      - ./data/keys/server.key:/mosquitto/certs/server.key:ro
      - ./data/keys/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "8883:8883"
    hostname: mosquitto
    restart: always

volumes:
  mongodb-data:
  mosquitto-data:
  mosquitto-log:
