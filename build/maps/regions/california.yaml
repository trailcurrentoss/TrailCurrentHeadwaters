# California — single-state extract, useful as a small/fast test region.
# Fastest build; smallest bundle relative to Photon dump size; good for
# verifying the pipeline end-to-end without committing to a full-country build.
#
# ./build.sh --region california

region: california
display_name: California
description: >
  U.S. state of California only. Small enough that Planetiler + Valhalla
  finish quickly. Tiles and routing cover California; search covers the
  entire world (every bundle ships the global Photon index).

pbf_sources:
  - https://download.geofabrik.de/north-america/us/california-latest.osm.pbf

# Photon search index is global for every bundle — see build.sh.

bbox:
  west: -124.5
  south: 32.5
  east: -114.0
  north: 42.1

estimated_footprint_gb:
  pmtiles: 2
  photon_data: 57   # global Photon dump — same across every region
  valhalla_tiles: 3
  bundle_zip: 60
